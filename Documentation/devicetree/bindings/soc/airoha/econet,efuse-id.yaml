%YAML 1.2
---
$id: http://devicetree.org/schemas/soc/airoha/econet,efuse-id.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: EcoNet EN7512 and EN7516 eFuse package identity shadow

maintainers:
  - Matheus Sampaio Queiroga <srherobrine20@gmail.com>

description: |
  The native-endian EFUSE_VERIFY_DATA0 word identifies the package variant
  within the family reported by NP SCU. This is a read-only shadow consumer
  interface, not an eFuse programming controller or the AFE calibration bank.

properties:
  compatible:
    items:
      - enum:
          - econet,en751221-efuse-id
          - econet,en751627-efuse-id
      - const: syscon

  reg:
    maxItems: 1

  native-endian: true

required:
  - compatible
  - reg
  - native-endian

additionalProperties: false

examples:
  - |
    syscon@1fbf8214 {
        compatible = "econet,en751221-efuse-id", "syscon";
        reg = <0x1fbf8214 0x4>;
        native-endian;
    };
