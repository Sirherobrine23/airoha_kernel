%YAML 1.2
---
$id: http://devicetree.org/schemas/clock/airoha,en7523-scu.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Airoha EN7523 System Control Unit clocks

maintainers:
  - Felix Fietkau <nbd@nbd.name>
  - John Crispin <nbd@nbd.name>

description: |
  The System Control Unit provides clocks and resets for Airoha SoCs. On
  EN7523 the provider can also expose the CPU PLL clock. New device trees
  describe CHIP-SCU through a phandle and provide NP-SCU and MCUCFG as named
  resources. The legacy combined two-resource EN7523 layout remains valid.

properties:
  compatible:
    oneOf:
      - const: airoha,en7523-scu
      - items:
          - const: airoha,en7523-scu
          - const: airoha,scuclk
          - const: syscon
      - const: airoha,en7581-scu

  reg:
    minItems: 1
    maxItems: 2

  reg-names:
    items:
      - const: np-scu
      - const: mcucfg
    minItems: 2
    maxItems: 2

  airoha,chip-scu:
    $ref: /schemas/types.yaml#/definitions/phandle
    description: Phandle to the EN7523 CHIP-SCU syscon.

  "#clock-cells":
    description: Clock identifier from include/dt-bindings/clock/en7523-clk.h.
    const: 1

  "#reset-cells":
    description: Reset identifier.
    const: 1

required:
  - compatible
  - reg
  - "#clock-cells"

allOf:
  - if:
      properties:
        compatible:
          contains:
            const: airoha,scuclk
    then:
      properties:
        reg:
          items:
            - description: NP-SCU registers
            - description: MCUCFG registers used while switching the CPU PLL
          minItems: 2
          maxItems: 2
      required:
        - reg-names
        - airoha,chip-scu

  - if:
      properties:
        compatible:
          const: airoha,en7523-scu
    then:
      properties:
        reg:
          items:
            - description: CHIP-SCU registers
            - description: NP-SCU registers
          minItems: 2
          maxItems: 2

  - if:
      properties:
        compatible:
          const: airoha,en7581-scu
    then:
      properties:
        reg:
          maxItems: 1
        reg-names: false
        airoha,chip-scu: false

additionalProperties: false

examples:
  - |
    #include <dt-bindings/clock/en7523-clk.h>

    chip_scu: syscon@1fa20000 {
      compatible = "airoha,chip-scu", "syscon";
      reg = <0x1fa20000 0x400>;
    };

    scuclk: system-controller@1fb00000 {
      compatible = "airoha,en7523-scu", "airoha,scuclk", "syscon";
      reg = <0x1fb00000 0x1000>,
            <0x1efbe000 0x800>;
      reg-names = "np-scu", "mcucfg";
      airoha,chip-scu = <&chip_scu>;
      #clock-cells = <1>;
      #reset-cells = <1>;
    };

  - |
    soc {
      #address-cells = <2>;
      #size-cells = <2>;

      scuclk: clock-controller@1fb00000 {
        compatible = "airoha,en7581-scu";
        reg = <0x0 0x1fb00000 0x0 0x970>;
        #clock-cells = <1>;
        #reset-cells = <1>;
      };
    };
