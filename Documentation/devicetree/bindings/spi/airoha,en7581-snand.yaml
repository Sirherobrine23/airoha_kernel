%YAML 1.2
---
$id: http://devicetree.org/schemas/spi/airoha,en7581-snand.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: SPI flash controller for Airoha and EcoNet SoCs

maintainers:
  - Lorenzo Bianconi <lorenzo@kernel.org>

allOf:
  - $ref: spi-controller.yaml#

properties:
  compatible:
    enum:
      - econet,en751221-spi
      - airoha,en751627-spi
      - airoha,en7523-spi

  reg:
    items:
      - description: spi base address
      - description: nfi2spi base address

  reg-names:
    items:
      - const: ctrl
      - const: nfi

  airoha,scu:
    $ref: /schemas/types.yaml#/definitions/phandle
    description: NP-SCU syscon containing the SoC boot configuration.

  clocks:
    maxItems: 1

  clock-names:
    items:
      - const: spi

required:
  - compatible
  - reg
  - clocks
  - clock-names

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/clock/en7523-clk.h>

    soc {
      #address-cells = <2>;
      #size-cells = <2>;

      spi@1fa10000 {
        compatible = "airoha,en7523-spi";
        reg = <0x0 0x1fa10000 0x0 0x140>,
              <0x0 0x1fa11000 0x0 0x160>;

        clocks = <&scuclk EN7523_CLK_SPI>;
        clock-names = "spi";

        #address-cells = <1>;
        #size-cells = <0>;

        flash@0 {
          compatible = "spi-nand";
          reg = <0>;
          spi-tx-bus-width = <1>;
          spi-rx-bus-width = <2>;
        };
      };
    };
  - |
    #include <dt-bindings/clock/en7523-clk.h>

    soc {
      #address-cells = <2>;
      #size-cells = <2>;

      spi@1fa10000 {
        compatible = "airoha,en751627-spi";
        reg = <0x1fa10000 0x140>,
              <0x1fa11000 0x600>;
        reg-names = "ctrl", "nfi";

        clocks = <&scuclk EN7523_CLK_SPI>;
        clock-names = "spi";

        #address-cells = <1>;
        #size-cells = <0>;

        flash@0 {
          compatible = "spi-nand";
          reg = <0>;
          spi-tx-bus-width = <1>;
          spi-rx-bus-width = <2>;
        };
      };
    };
  - |
    #include <dt-bindings/clock/en7523-clk.h>

    soc {
      #address-cells = <2>;
      #size-cells = <2>;

      spi@1fa10000 {
        compatible = "econet,en751221-spi";
        reg = <0x1fa10000 0x140>;
      
        clocks = <&scuclk EN7523_CLK_SPI>;
        clock-names = "spi";
        #address-cells = <1>;
        #size-cells = <0>;

        flash@0 {
          compatible = "spi-nand";
          reg = <0>;
          spi-tx-bus-width = <1>;
          spi-rx-bus-width = <2>;
        };
      };
    };
