%YAML 1.2
---
$id: http://devicetree.org/schemas/net/econet,en751221-eth.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: EcoNet EN751221 frame-engine Ethernet controller

maintainers:
  - Caleb James DeLisle <cjd@cjdns.fr>

description: |
  The EN751221-family frame engine contains two GDM MAC ports and two QDMA
  packet engines. GDM1 is normally connected to the CPU port of an MT7530
  switch, while GDM2 is available for a WAN PHY or an xPON datapath. Each GDM
  is represented by an Ethernet child node and uses phylink in the same way as
  the newer Airoha frame-engine driver.

properties:
  compatible:
    enum:
      - econet,en751221-eth
      - econet,en7528-eth

  reg:
    items:
      - description: Frame-engine, GDM1, PPE and GDM2 registers
      - description: QDMA0 registers
      - description: QDMA1 registers

  reg-names:
    items:
      - const: fe
      - const: qdma0
      - const: qdma1

  interrupts:
    items:
      - description: QDMA0 interrupt
      - description: QDMA1 interrupt

  resets:
    minItems: 1
    maxItems: 3

  reset-names:
    minItems: 1
    items:
      - const: fe
      - const: qdma0
      - const: qdma1

  memory-region:
    minItems: 1
    maxItems: 3
    description: |
      Optional reserved memory regions. The qdma0-buf and qdma1-buf regions
      are reserved for QDMA packet memory. Hardware flow offload requires a
      ppe-foe region of at least 0x140000 bytes below 4 GiB.

  memory-region-names:
    minItems: 1
    maxItems: 3
    items:
      enum:
        - qdma0-buf
        - qdma1-buf
        - ppe-foe

  "#address-cells":
    const: 1

  "#size-cells":
    const: 0

patternProperties:
  "^ethernet@[12]$":
    type: object
    $ref: ethernet-controller.yaml#
    unevaluatedProperties: false

    properties:
      compatible:
        const: econet,eth-mac

      reg:
        minimum: 1
        maximum: 2
        description: One-based GDM port identifier

    required:
      - compatible
      - reg
      - phy-mode

required:
  - compatible
  - reg
  - reg-names
  - interrupts
  - "#address-cells"
  - "#size-cells"

additionalProperties: false

examples:
  - |
    ethernet@1fb50000 {
        compatible = "econet,en751221-eth";
        reg = <0x1fb50000 0x2600>,
              <0x1fb54000 0x2000>,
              <0x1fb56000 0x2000>;
        reg-names = "fe", "qdma0", "qdma1";

        interrupt-parent = <&intc>;
        interrupts = <21>, <22>;

        #address-cells = <1>;
        #size-cells = <0>;

        gdm1: ethernet@1 {
            compatible = "econet,eth-mac";
            reg = <1>;
            phy-mode = "internal";

            fixed-link {
                speed = <10000>;
                full-duplex;
                pause;
            };
        };

        gdm2: ethernet@2 {
            compatible = "econet,eth-mac";
            reg = <2>;
            phy-mode = "internal";
            status = "disabled";
        };
    };
