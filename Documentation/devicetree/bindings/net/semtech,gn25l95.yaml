%YAML 1.2
---
$id: http://devicetree.org/schemas/net/semtech,gn25l95.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Semtech GN25L95 xPON optical frontend

maintainers:
  - Matheus Sampaio Queiroga <srherobrine20@gmail.com>

description: |
  The GN25L95 is a 2.5 Gbit/s burst-mode laser driver and limiting post
  amplifier intended for GPON and EPON optical network units.  It provides
  SFF-8472 compatible digital diagnostics over I2C.  The host A2 page normally
  appears at 7-bit address 0x51; the address can be changed by device NVM.

properties:
  compatible:
    const: semtech,gn25l95

  reg:
    maxItems: 1
    description:
      I2C address of the GN25L95 A2 host page, normally 0x51.

  '#optical-frontend-cells':
    const: 0
    description:
      The GN25L95 exposes one optical frontend provider.

  tx-disable-gpios:
    $ref: /schemas/types.yaml#/definitions/phandle-array
    maxItems: 1
    description:
      GPIO connected to the optical transmitter disable input.

  firmware-name:
    $ref: /schemas/types.yaml#/definitions/string
    description: |
      Name of the 2048-byte board-specific BOSA calibration image. The image
      uses the MediaTek/EcoNet vendor /bosa/hwconfig layout and is required
      when STATUS_0 reports that no external EEPROM is present. If omitted,
      the driver requests semtech/gn25l95-hwconfig.bin.

required:
  - compatible
  - reg
  - '#optical-frontend-cells'

additionalProperties: false

examples:
  - |
    i2c {
        #address-cells = <1>;
        #size-cells = <0>;

        optical-frontend@51 {
            compatible = "semtech,gn25l95";
            reg = <0x51>;
            #optical-frontend-cells = <0>;
            firmware-name = "semtech/gpt2741-gn25l95-hwconfig.bin";
        };
    };
