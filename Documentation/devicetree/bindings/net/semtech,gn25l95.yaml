%YAML 1.2
---
$id: http://devicetree.org/schemas/net/semtech,gn25l95.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Semtech GN25L95 and GN25L98 xPON optical frontends

maintainers:
  - Matheus Sampaio Queiroga <srherobrine20@gmail.com>

description: |
  The GN25L95 and GN25L98 are 2.5 Gbit/s burst-mode laser drivers and limiting
  post amplifiers intended for GPON and EPON optical network units. They
  provide SFF-8472 compatible digital diagnostics over I2C. The host A2 page
  normally appears at 7-bit address 0x51; the address can be changed by device
  NVM.

properties:
  compatible:
    enum:
      - semtech,gn25l95
      - semtech,gn25l98

  reg:
    maxItems: 1
    description:
      I2C address of the GN25L95/GN25L98 A2 host page, normally 0x51.

  '#optical-frontend-cells':
    const: 0
    description:
      The device exposes one optical frontend provider.

  nvmem-cells:
    maxItems: 1
    description: |
      BOSA calibration cell. On the Nokia GN25L98 this is a 128-byte
      CRC-protected manufacturer parameter record used to derive the Semtech
      register tables; a 640-byte already-calibrated image is also accepted.
      GN25L95 uses its 2048-byte calibrated register image. An explicitly
      supplied NVMEM cell takes precedence over firmware-name.

  nvmem-cell-names:
    items:
      - const: calibration

  firmware-name:
    $ref: /schemas/types.yaml#/definitions/string
    description: |
      Name of the board-specific BOSA calibration image. GN25L95 uses the
      2048-byte MediaTek/EcoNet /bosa/hwconfig layout. GN25L98 uses a 640-byte
      final calibrated image containing table 6, table 5, table 4, table 2 and
      table 0, each occupying 128 bytes. The table 6 block must contain the
      board-specific APD LUT in bytes 0x00..0x3f. GN25L98 calibration images
      must not be reused on GN25L95 devices. If no NVMEM calibration cell
      is provided, the driver requests the chip-specific
      semtech/gn25l95-hwconfig.bin or semtech/gn25l98-hwconfig.bin image.

  nvmem-cells:
    maxItems: 1
    description: |
      Optional board-specific, already formatted Semtech hwconfig image. The
      cell must contain exactly 2048 bytes for GN25L95 or 640 bytes for
      GN25L98. This is not the Nokia 2048-byte manufacturing/BOSA metadata
      record. When supplied, NVMEM is used in preference to firmware-name.

  nvmem-cell-names:
    items:
      - const: calibration

required:
  - compatible
  - reg
  - '#optical-frontend-cells'

dependencies:
  nvmem-cells: [nvmem-cell-names]
  nvmem-cell-names: [nvmem-cells]

additionalProperties: false

examples:
  - |
    i2c {
        #address-cells = <1>;
        #size-cells = <0>;

        optical-frontend@51 {
            compatible = "semtech,gn25l98";
            reg = <0x51>;
            #optical-frontend-cells = <0>;
            firmware-name = "semtech/board-gn25l98-hwconfig.bin";
        };
    };
