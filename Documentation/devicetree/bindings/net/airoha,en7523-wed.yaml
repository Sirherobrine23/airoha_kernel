%YAML 1.2
---
$id: http://devicetree.org/schemas/net/airoha,en7523-wed.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Airoha and EcoNet WED v1 controller

maintainers:
  - Lorenzo Bianconi <lorenzo@kernel.org>

description:
  The Wireless Ethernet Dispatch (WED) controller connects a PCIe wireless
  DMA engine to the Ethernet frame engine and offloads the wireless transmit
  datapath. Each WED instance is associated with one PCIe domain and one
  WDMA instance.

properties:
  compatible:
    items:
      - enum:
          - econet,en751221-wed
          - econet,en7528-wed
          - airoha,en7523-wed
      - const: syscon

  airoha,scu:
    $ref: /schemas/types.yaml#/definitions/phandle
    description:
      System controller used to select LAN arbitration mode on EN7528.

  reg:
    items:
      - description: WED register block
      - description: WDMA register block

  reg-names:
    items:
      - const: wed
      - const: wdma

  interrupts:
    maxItems: 1

required:
  - compatible
  - reg
  - reg-names
  - interrupts

allOf:
  - if:
      properties:
        compatible:
          contains:
            const: econet,en7528-wed
    then:
      required:
        - airoha,scu

additionalProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/arm-gic.h>
    #include <dt-bindings/interrupt-controller/irq.h>

    wed@1fa02000 {
      compatible = "airoha,en7523-wed", "syscon";
      reg = <0x1fa02000 0xb00>,
            <0x1fa06000 0x400>;
      reg-names = "wed", "wdma";
      interrupts = <GIC_SPI 67 IRQ_TYPE_LEVEL_HIGH>;
    };
