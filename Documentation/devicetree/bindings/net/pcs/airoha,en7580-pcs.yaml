%YAML 1.2
---
$id: http://devicetree.org/schemas/net/pcs/airoha,en7580-pcs.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Airoha EN7580 Ethernet XSI PCS

maintainers:
  - Matheus Sampaio Queiroga <srherobrine20@gmail.com>

description:
  The EN7580 Ethernet XSI lane has an XSI MAC, a dedicated PMA and XFI/HSGMII
  digital PCS blocks. This lane is separate from the optical PON PMA.
  Negotiation is managed by the external Ethernet PHY.

properties:
  compatible:
    const: airoha,en7580-pcs

  reg:
    items:
      - description: XSI MAC
      - description: XSI PMA
      - description: XFI and HSGMII digital PCS blocks

  reg-names:
    items:
      - const: mac
      - const: pma
      - const: pcs

  airoha,scu:
    $ref: /schemas/types.yaml#/definitions/phandle
    description: NP SCU syscon.

  airoha,chip-scu:
    $ref: /schemas/types.yaml#/definitions/phandle
    description: Chip SCU syscon.

  '#pcs-cells':
    const: 0

required:
  - compatible
  - reg
  - reg-names
  - airoha,scu
  - airoha,chip-scu
  - '#pcs-cells'

additionalProperties: false

examples:
  - |
    pcs@1fa04000 {
        compatible = "airoha,en7580-pcs";
        reg = <0x1fa04000 0x200>,
              <0x1faf6000 0x1000>,
              <0x1faf7900 0x1000>;
        reg-names = "mac", "pma", "pcs";
        airoha,scu = <&scuclk>;
        airoha,chip-scu = <&chip_scu>;
        #pcs-cells = <0>;
    };
