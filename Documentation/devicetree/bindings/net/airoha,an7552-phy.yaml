%YAML 1.2
---
$id: http://devicetree.org/schemas/net/airoha,an7552-phy.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Airoha AN7552 and AN7563 integrated Gigabit PHYs

maintainers:
  - Matheus Sampaio Queiroga <srherobrine20@gmail.com>

select:
  required:
    - airoha,mdi-resistor-ohms

allOf:
  - $ref: ethernet-phy.yaml#

properties:
  reg:
    minimum: 9
    maximum: 12

  airoha,mdi-resistor-ohms:
    enum: [0, 5]
    default: 5
    description: External MDI series resistance used by the board design.

  airoha,integrated-transformer:
    type: boolean
    description: Use the SDK compensation profile for an integrated transformer.

required:
  - reg

unevaluatedProperties: false
