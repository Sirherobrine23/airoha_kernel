%YAML 1.2
---
$id: http://devicetree.org/schemas/net/airoha,en7523-xpon.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Airoha and EcoNet shared GPON and EPON MAC

maintainers:
  - Matheus Sampaio Queiroga <srherobrine20@gmail.com>

description: |
  The Airoha EN7523 and EcoNet EN751221/EN7521 families contain one xPON
  MAC complex shared by the GPON and EPON protocol engines. Both generations
  use GDM2/CDM2 as the packet datapath and expose the xPON register region at
  0x1fb60000, with GPON at offset 0x4000 and EPON at offset 0x6000.

  EN7523 exposes a standalone xPON MAC interrupt. On EN751221-family MIPS
  SoCs the GPON/EPON MAC interrupt is aggregated by the WAN QDMA block and
  therefore is not described as a platform interrupt on this node.

properties:
  compatible:
    oneOf:
      - enum:
          - airoha,en7523-xpon
          - econet,en751221-xpon
          - econet,en7521-xpon
          - econet,en7526-xpon
      - enum:
          - airoha,en7523-gpon
          - airoha,en7523-epon
          - econet,en7521-gpon
          - econet,en7526-gpon
          - econet,en751221-gpon
          - econet,en7521-epon
          - econet,en7526-epon
          - econet,en751221-epon

  reg:
    minItems: 1
    maxItems: 4

  reg-names:
    minItems: 1
    items:
      - const: mac
      - enum: [tx-off, epon-reset]
      - const: epon-reset

  interrupts:
    minItems: 1
    maxItems: 2
    description:
      EN7523 xPON MAC interrupt followed by an optional platform
      power-fail/dying-gasp interrupt. EcoNet EN751221-family SoCs route the
      MAC interrupt through QDMA1 and normally omit this property.

  interrupt-names:
    minItems: 1
    items:
      - const: mac
      - const: dying-gasp

  resets:
    maxItems: 1
    description:
      Reset line for the shared xPON MAC register and table state. The driver
      pulses this reset before every GPON or EPON session start so no T-CONT,
      GEM, OMCC, encryption or activation state leaks between sessions.

  reset-names:
    const: mac

  ethernet:
    $ref: /schemas/types.yaml#/definitions/phandle
    description:
      Optional phandle to the GDM2 child used as the xPON datapath. When
      omitted, the driver discovers the SoC GDM2 netdev.

  airoha,scu:
    $ref: /schemas/types.yaml#/definitions/phandle
    description:
      Phandle to the SoC SCU syscon used to select GPON or EPON mode.

  airoha,pon-mode:
    description:
      Protocol engine selected for a unified *-xpon compatible. The property
      is optional and defaults to GPON. Legacy mode-specific compatibles do
      not require it.
    enum: [gpon, epon]

  airoha,gpon-serial-number:
    deprecated: true
    $ref: /schemas/types.yaml#/definitions/uint8-array
    minItems: 8
    maxItems: 8
    description:
      Eight-byte GPON serial number. The first four bytes are the vendor ID
      and the last four bytes are the vendor-specific serial number.

  airoha,gpon-password:
    deprecated: true
    $ref: /schemas/types.yaml#/definitions/uint8-array
    minItems: 10
    maxItems: 10
    description:
      Ten-byte GPON registration password. The driver must not expose the
      password through kernel logs.

  airoha,gpon-serial-from-mac:
    type: boolean
    description: |
      Derive the four-byte vendor-specific part of the GPON serial number
      from the last four octets of the GDM2 MAC address. The vendor prefix
      is supplied by omci-vendor-id. This is intended for boards whose stock
      firmware derives the optical serial number from the factory Ethernet
      address instead of storing a dedicated GPON serial number.

  phys:
    maxItems: 1
    description: Phandle to the SoC digital xPON PHY.

  phy-names:
    const: xpon

  sfp:
    $ref: /schemas/types.yaml#/definitions/phandle
    description: Phandle to the optical module or virtual SFP cage.

required:
  - compatible
  - reg
  - airoha,scu
  - sfp

dependencies:
  airoha,gpon-serial-from-mac:
    - omci-vendor-id

allOf:
  - $ref: /schemas/net/omci.yaml#
  - if:
      properties:
        compatible:
          enum:
            - airoha,en7523-xpon
            - econet,en751221-xpon
            - econet,en7521-xpon
            - econet,en7526-xpon
    then:
      required:
        - phys
        - phy-names
        - resets
        - reset-names
      properties:
        airoha,pon-mode: true
    else:
      required:
        - phys
        - phy-names
      properties:
        airoha,pon-mode: false
  - if:
      properties:
        compatible:
          enum:
            - airoha,en7523-xpon
            - airoha,en7523-gpon
            - airoha,en7523-epon
    then:
      required:
        - interrupts
        - interrupt-names

additionalProperties: true

examples:
  - |
    #include <dt-bindings/interrupt-controller/arm-gic.h>
    #include <dt-bindings/reset/airoha,en7523-reset.h>

    pon0: sfp {
        compatible = "sff,sfp";
        i2c-bus = <&i2c_sfp>;
    };

    xpon@1fb60000 {
        compatible = "airoha,en7523-xpon";
        reg = <0x1fb60000 0x10000>;
        reg-names = "mac";
        interrupts = <GIC_SPI 42 IRQ_TYPE_LEVEL_HIGH>;
        interrupt-names = "mac";
        resets = <&scuclk EN7523_XPON_MAC_RST>;
        reset-names = "mac";
        airoha,scu = <&scuclk>;
        airoha,pon-mode = "gpon";
        airoha,gpon-serial-number = [49 4e 56 50 71 43 86 02];
        airoha,gpon-password = [30 30 31 34 34 35 31 38 33 30];
        phys = <&xpon_phy>;
        phy-names = "xpon";
        sfp = <&pon0>;
    };
...
