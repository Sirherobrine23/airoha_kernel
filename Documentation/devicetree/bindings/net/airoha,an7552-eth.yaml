%YAML 1.2
---
$id: http://devicetree.org/schemas/net/airoha,an7552-eth.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Airoha AN7552 and AN7563 Frame Engine

maintainers:
  - Matheus Sampaio Queiroga <srherobrine20@gmail.com>

description: |
  AN7552 and AN7563 have two QDMA engines and an integrated Gigabit switch.
  The switch CPU port connects to GDM1. The initial driver supports the
  copper LAN datapath; PON and Ethernet SerDes require separate providers.

properties:
  compatible:
    oneOf:
      - const: airoha,an7552-eth
      - items:
          - const: airoha,an7563-eth
          - const: airoha,an7552-eth

  reg:
    items:
      - description: Frame engine registers
      - description: QDMA LAN registers
      - description: QDMA WAN registers
      - description: GDMP SRAM configuration

  reg-names:
    items:
      - const: fe
      - const: qdma0
      - const: qdma1
      - const: gdmp

  interrupts:
    minItems: 10
    maxItems: 10

  interrupt-names:
    items:
      - const: lan0
      - const: lan1
      - const: lan2
      - const: lan3
      - const: wan0
      - const: wan1
      - const: wan2
      - const: wan3
      - const: fe-error
      - const: pdma

  resets:
    items:
      - description: Frame engine reset
      - description: PDMA reset
      - description: QDMA reset

  reset-names:
    items:
      - const: fe
      - const: pdma
      - const: qdma

  memory-region:
    items:
      - description: QDMA LAN forwarding payload memory
      - description: QDMA WAN forwarding payload memory

  memory-region-names:
    items:
      - const: qdma0-buf
      - const: qdma1-buf

  '#address-cells':
    const: 1

  '#size-cells':
    const: 0

  ethernet@1:
    type: object
    $ref: ethernet-controller.yaml#
    unevaluatedProperties: false
    properties:
      compatible:
        const: airoha,eth-mac
      reg:
        const: 1
    required:
      - compatible
      - reg
      - phy-mode

required:
  - compatible
  - reg
  - reg-names
  - interrupts
  - interrupt-names
  - resets
  - reset-names
  - '#address-cells'
  - '#size-cells'

additionalProperties: false
