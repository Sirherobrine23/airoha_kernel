%YAML 1.2
---
$id: http://devicetree.org/schemas/net/airoha,an7552-eth.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Airoha AN7552 and AN7563 Frame Engine Ethernet controller

maintainers:
  - Matheus Sampaio Queiroga <srherobrine20@gmail.com>

description: |
  AN7552 and AN7563 have two QDMA engines and an integrated Gigabit switch.
  The switch CPU port connects to GDM1.

properties:
  compatible:
    oneOf:
      - const: airoha,an7552-eth
      - items:
          - const: airoha,an7563-eth
          - const: airoha,an7552-eth

  reg:
    items:
      - description: Frame engine registers
      - description: QDMA LAN registers
      - description: QDMA WAN registers
      - description: GDMP SRAM configuration

  reg-names:
    items:
      - const: fe
      - const: qdma0
      - const: qdma1
      - const: gdmp

  interrupts:
    items:
      - description: QDMA lan irq0
      - description: QDMA lan irq1
      - description: QDMA lan irq2
      - description: QDMA lan irq3
      - description: QDMA wan irq0
      - description: QDMA wan irq1
      - description: QDMA wan irq2
      - description: QDMA wan irq3
      - description: FE error irq
      - description: PDMA irq

  interrupt-names:
    items:
      - const: lan0
      - const: lan1
      - const: lan2
      - const: lan3
      - const: wan0
      - const: wan1
      - const: wan2
      - const: wan3
      - const: fe-error
      - const: pdma

  resets:
    minItems: 3
    items:
      - description: Frame engine reset
      - description: PDMA reset
      - description: QDMA reset
      - description: GDMP reset
      - description: TDMA reset

  reset-names:
    minItems: 3
    items:
      - const: fe
      - const: pdma
      - const: qdma
      - const: gdmp
      - const: tdma

  memory-region:
    items:
      - description: QDMA LAN forwarding payload memory
      - description: QDMA WAN forwarding payload memory

  memory-region-names:
    items:
      - const: qdma0-buf
      - const: qdma1-buf

  airoha,npu:
    $ref: /schemas/types.yaml#/definitions/phandle
    description:
      Phandle to the node used to configure the NPU module.

  airoha,wed:
    $ref: /schemas/types.yaml#/definitions/phandle-array
    minItems: 1
    maxItems: 2
    description:
      WED instances associated with the PCIe domains used by the wireless
      devices. Entries are ordered by PCI domain number.

  '#address-cells':
    const: 1

  '#size-cells':
    const: 0

patternProperties:
  "^ethernet@[1-4]$":
    type: object
    $ref: ethernet-controller.yaml#
    unevaluatedProperties: false
    description:
      Ethernet GMAC port associated with the MAC controller
    properties:
      compatible:
        const: airoha,eth-mac

      reg:
        minimum: 1
        maximum: 4
        description: GMAC port identifier

    required:
      - compatible
      - reg

required:
  - compatible
  - reg
  - reg-names
  - interrupts
  - interrupt-names
  - resets
  - reset-names
  - '#address-cells'
  - '#size-cells'

additionalProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/arm-gic.h>
    #include <dt-bindings/interrupt-controller/irq.h>

    ethernet@1fb50000 {
      compatible = "airoha,an7552-eth";
      reg = <0x1fb50000 0x2600>,
            <0x1fb54000 0x2000>,
            <0x1fb56000 0x2000>,
            <0x1fbf9000 0x1000>;
      reg-names = "fe", "qdma0", "qdma1", "gdmp";
      resets = <&scuclk 44>,
               <&scuclk 30>,
               <&scuclk 31>,
               <&scuclk 45>,
               <&scuclk 46>;
      reset-names = "fe", "pdma", "qdma", "gdmp", "tdma";
      interrupts = <GIC_SPI 37 IRQ_TYPE_LEVEL_HIGH>,
                   <GIC_SPI 55 IRQ_TYPE_LEVEL_HIGH>,
                   <GIC_SPI 56 IRQ_TYPE_LEVEL_HIGH>,
                   <GIC_SPI 57 IRQ_TYPE_LEVEL_HIGH>,
                   <GIC_SPI 38 IRQ_TYPE_LEVEL_HIGH>,
                   <GIC_SPI 58 IRQ_TYPE_LEVEL_HIGH>,
                   <GIC_SPI 59 IRQ_TYPE_LEVEL_HIGH>,
                   <GIC_SPI 60 IRQ_TYPE_LEVEL_HIGH>,
                   <GIC_SPI 49 IRQ_TYPE_LEVEL_HIGH>,
                   <GIC_SPI 64 IRQ_TYPE_LEVEL_HIGH>;
      interrupt-names = "lan0", "lan1", "lan2", "lan3",
                        "wan0", "wan1", "wan2", "wan3",
                        "fe-error", "pdma";
      memory-region = <&qdma0_buf>, <&qdma1_buf>;
      memory-region-names = "qdma0-buf", "qdma1-buf";
      airoha,npu = <&npu>;
      #address-cells = <1>;
      #size-cells = <0>;

      ethernet@1 {
        compatible = "airoha,eth-mac";
        reg = <1>;
        phy-mode = "internal";
      };
    };
