%YAML 1.2
---
$id: http://devicetree.org/schemas/phy/airoha,en7523-xpon-phy.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Airoha and EcoNet GPON and EPON PHY

maintainers:
  - Matheus Sampaio Queiroga <srherobrine20@gmail.com>

description: |
  Airoha EN7523 and EcoNet EN751221 contain a digital xPON PHY shared by the
  GPON and EPON MAC engines. The generations share the GPON/EPON digital
  register block; EN7523 additionally integrates PMA/SerDes controls.

properties:
  compatible:
    enum:
      - airoha,en7523-xpon-phy
      - econet,en751221-xpon-phy

  reg:
    maxItems: 1

  resets:
    maxItems: 1

  reset-names:
    const: phy

  airoha,scu:
    $ref: /schemas/types.yaml#/definitions/phandle
    description:
      Phandle to the SoC system-controller syscon used by the xPON PHY.

  airoha,chip-scu:
    $ref: /schemas/types.yaml#/definitions/phandle
    description:
      Phandle to the EN751221 CHIP-SCU syscon used for the PON I/O mux.

  airoha,tx-sd-inverted:
    type: boolean
    description:
      The optical transceiver drives transmit signal detect in the inverted
      sense.

  airoha,tx-fault-inverted:
    type: boolean
    description:
      The optical transceiver drives transmit fault in the inverted sense.

  airoha,rx-sd-inverted:
    type: boolean
    description: |
      The optical transceiver drives receive loss-of-signal rather than
      receive signal detect, so an asserted pin means light has been lost
      instead of light being present. Setting this on a board whose optics
      drive receive signal detect, or leaving it unset on a board whose
      optics drive loss-of-signal, makes the PHY report the optical link
      state inverted.

  airoha,burst-enable-inverted:
    type: boolean
    description:
      The optical transceiver expects burst enable in the inverted sense.

  '#phy-cells':
    const: 0

required:
  - compatible
  - reg
  - resets
  - reset-names
  - airoha,scu
  - '#phy-cells'

allOf:
  - if:
      properties:
        compatible:
          const: econet,en751221-xpon-phy
    then:
      required:
        - airoha,chip-scu
    else:
      properties:
        airoha,chip-scu: false

additionalProperties: false

examples:
  - |
    #include <dt-bindings/reset/airoha,en7523-reset.h>

    phy@1faf0000 {
        compatible = "airoha,en7523-xpon-phy";
        reg = <0x1faf0000 0x5000>;
        resets = <&scuclk EN7523_XPON_PHY_RST>;
        reset-names = "phy";
        airoha,scu = <&scuclk>;
        #phy-cells = <0>;
    };

  - |
    #include <dt-bindings/reset/econet,en751221-scu.h>

    phy@1faf0000 {
        compatible = "econet,en751221-xpon-phy";
        reg = <0x1faf0000 0x600>;
        resets = <&scuclk EN751221_XPON_PHY_RST>;
        reset-names = "phy";
        airoha,scu = <&scuclk>;
        airoha,chip-scu = <&chip_scu>;
        #phy-cells = <0>;
    };
...
