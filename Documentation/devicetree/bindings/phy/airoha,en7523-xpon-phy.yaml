%YAML 1.2
---
$id: http://devicetree.org/schemas/phy/airoha,en7523-xpon-phy.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Airoha and EcoNet GPON and EPON PHY

maintainers:
  - Matheus Sampaio Queiroga <srherobrine20@gmail.com>

description: |
  Airoha EN7523/EN7528 and EcoNet EN751221 contain a digital xPON PHY shared by the
  GPON and EPON MAC engines. The generations share the GPON/EPON digital
  register block; EN7523 and EN7528 additionally integrate PMA/SerDes controls.
  AN7552 has a separate optical SerDes and LCPLL/CDR programming sequence.
  The optical PHY and the Ethernet PON PCS share the AN7552 SerDes and cannot
  be enabled simultaneously.
  AN7581 and AN7583 share the digital GEPON register block but have separate
  PON analog and PMA resources for their optical SerDes.

properties:
  compatible:
    enum:
      - airoha,an7552-xpon-phy
      - airoha,an7581-xpon-phy
      - airoha,an7583-xpon-phy
      - airoha,en7523-xpon-phy
      - airoha,en751627-xpon-phy
      - airoha,en7528-xpon-phy
      - econet,en751221-xpon-phy

  reg:
    minItems: 1
    maxItems: 3

  reg-names:
    items:
      - const: pcs
      - const: ana
      - const: pma

  interrupts:
    maxItems: 1
    description: Optional digital PHY interrupt; the driver may poll link state.

  interrupt-names:
    const: phy

  resets:
    maxItems: 1

  reset-names:
    const: phy

  airoha,scu:
    $ref: /schemas/types.yaml#/definitions/phandle
    description:
      Phandle to the SoC system-controller syscon used by the xPON PHY.

  airoha,chip-scu:
    $ref: /schemas/types.yaml#/definitions/phandle
    description:
      Phandle to the chip SCU. AN7552 uses offset 0x258 bit 19 to select
      whether its optical PLL needs K-band recovery.

  tx-disable-gpios:
    maxItems: 1
    description: |
      GPIO connected to the optical transmitter TX_DISABLE input. The GPIO
      polarity describes the asserted (transmitter disabled) level. The xPON
      PHY owns this signal and keeps it asserted while changing PHY mode.

  vcc-disable-gpios:
    maxItems: 1
    description: |
      Optional GPIO controlling the transmitter/BOSA power-disable input. The
      GPIO polarity describes the asserted (power disabled) level.

  airoha,tx-sd-inverted:
    type: boolean
    description:
      The optical transceiver drives transmit signal detect in the inverted
      sense.

  airoha,tx-fault-inverted:
    type: boolean
    description:
      The optical transceiver drives transmit fault in the inverted sense.

  airoha,rx-sd-inverted:
    type: boolean
    description: |
      The optical transceiver drives receive loss-of-signal rather than
      receive signal detect, so an asserted pin means light has been lost
      instead of light being present. Setting this on a board whose optics
      drive receive signal detect, or leaving it unset on a board whose
      optics drive loss-of-signal, makes the PHY report the optical link
      state inverted.

  airoha,burst-enable-inverted:
    type: boolean
    description:
      The optical transceiver expects burst enable in the inverted sense.

  '#phy-cells':
    const: 0

required:
  - compatible
  - reg
  - resets
  - reset-names
  - airoha,scu
  - '#phy-cells'

allOf:
  - if:
      properties:
        compatible:
          enum:
            - airoha,an7581-xpon-phy
            - airoha,an7583-xpon-phy
    then:
      properties:
        reg:
          minItems: 3
          maxItems: 3
      required:
        - reg-names
        - tx-disable-gpios
    else:
      properties:
        reg:
          maxItems: 1
        reg-names: false

  - if:
      properties:
        compatible:
          enum:
            - econet,en751221-xpon-phy
            - airoha,an7552-xpon-phy
    then:
      required:
        - airoha,chip-scu
    else:
      properties:
        airoha,chip-scu: false

  - if:
      properties:
        compatible:
          const: airoha,an7552-xpon-phy
    then:
      required:
        - tx-disable-gpios

additionalProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>
    #include <dt-bindings/reset/airoha,en7581-reset.h>

    phy@1faf0000 {
        compatible = "airoha,an7581-xpon-phy";
        reg = <0x1faf0000 0x1000>,
              <0x1fa8a000 0x1000>,
              <0x1fa8b000 0x1000>;
        reg-names = "pcs", "ana", "pma";
        resets = <&scuclk EN7581_XPON_PHY_RST>;
        reset-names = "phy";
        airoha,scu = <&scuclk>;
        tx-disable-gpios = <&pinctrl 38 GPIO_ACTIVE_HIGH>;
        #phy-cells = <0>;
    };

  - |
    #include <dt-bindings/reset/airoha,en7523-reset.h>

    phy@1faf0000 {
        compatible = "airoha,en7523-xpon-phy";
        reg = <0x1faf0000 0x5000>;
        resets = <&scuclk EN7523_XPON_PHY_RST>;
        reset-names = "phy";
        airoha,scu = <&scuclk>;
        #phy-cells = <0>;
    };

  - |
    #include <dt-bindings/reset/econet,en751221-scu.h>

    phy@1faf0000 {
        compatible = "econet,en751221-xpon-phy";
        reg = <0x1faf0000 0x600>;
        resets = <&scuclk EN751221_XPON_PHY_RST>;
        reset-names = "phy";
        airoha,scu = <&scuclk>;
        airoha,chip-scu = <&chip_scu>;
        #phy-cells = <0>;
    };
...
