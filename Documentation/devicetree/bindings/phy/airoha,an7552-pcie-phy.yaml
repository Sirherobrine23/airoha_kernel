%YAML 1.2
---
$id: http://devicetree.org/schemas/phy/airoha,an7552-pcie-phy.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Airoha AN7552 and AN7563 PCIe PHY

maintainers:
  - Matheus Sampaio Queiroga <srherobrine20@gmail.com>

description: |
  The two PCIe PHY lanes share one provider. Initialization programs both
  lanes with the AN7552/AN7563 analog settings before the PCIe clock
  provider releases the endpoints from reset. This PHY does not use the
  EN7523 crystal-dependent PLL and power-saving sequence.

properties:
  compatible:
    enum:
      - airoha,an7552-pcie-phy
      - airoha,an7563-pcie-phy

  reg:
    items:
      - description: PCIe port 0 analog registers
      - description: PCIe port 1 analog registers

  reg-names:
    items:
      - const: pcie0
      - const: pcie1

  '#phy-cells':
    const: 0

required:
  - compatible
  - reg
  - reg-names
  - '#phy-cells'

additionalProperties: false

examples:
  - |
    phy@1fa93700 {
        compatible = "airoha,an7552-pcie-phy";
        reg = <0x1fa93700 0x568>, <0x1fa95700 0x568>;
        reg-names = "pcie0", "pcie1";
        #phy-cells = <0>;
    };
