%YAML 1.2
---
$id: http://devicetree.org/schemas/phy/airoha,en7580-xpon-phy.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Airoha EN7580 XGS-PON PHY

maintainers:
  - Matheus Sampaio Queiroga <srherobrine20@gmail.com>

description:
  The EN7580 has a 10G optical PCS and a PON PMA at offset 0x3000.
  These blocks use separate register ranges because the intervening window
  at offset 0x2000 belongs to the PCIe PHY. The Ethernet XFI PMA at offset
  0x6000 is also separate. Protocol selection is performed by the consumer.

properties:
  compatible:
    const: airoha,en7580-xpon-phy

  reg:
    items:
      - description: Optical PCS registers (0x1000 bytes).
      - description: PON PMA registers (0x1000 bytes).

  reg-names:
    items:
      - const: pcs
      - const: pma

  interrupts:
    maxItems: 1
    description: Digital PHY interrupt; the driver currently polls link state.

  interrupt-names:
    const: phy

  resets:
    maxItems: 1

  reset-names:
    const: phy

  airoha,scu:
    $ref: /schemas/types.yaml#/definitions/phandle
    description: NP system-controller syscon used for the WAN mux.

  tx-disable-gpios:
    maxItems: 1
    description:
      Optical transmitter TX_DISABLE input, described with its asserted
      disable polarity. It stays asserted until the consumer requests TX
      and the receiver synchronizes.

  vcc-disable-gpios:
    maxItems: 1
    description: Optional transceiver power-disable input, with disable polarity.

  airoha,tx-sd-inverted:
    type: boolean
    description: Transmit signal detect is active low.

  airoha,tx-fault-inverted:
    type: boolean
    description: Transmit fault is active low.

  airoha,rx-sd-inverted:
    type: boolean
    description:
      The transceiver drives active-high receive loss-of-signal instead of
      active-high receive signal detect.

  airoha,burst-enable-inverted:
    type: boolean
    description: Burst enable is active low.

  nvmem-cells:
    minItems: 3
    maxItems: 3
    description: Two-bit RX, TX positive and TX negative impedance trims.

  nvmem-cell-names:
    items:
      - const: rx-impedance
      - const: txp-impedance
      - const: txn-impedance

  '#phy-cells':
    const: 0

required:
  - compatible
  - reg
  - reg-names
  - resets
  - reset-names
  - airoha,scu
  - tx-disable-gpios
  - '#phy-cells'

dependentRequired:
  nvmem-cells: [nvmem-cell-names]
  nvmem-cell-names: [nvmem-cells]

additionalProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>
    #include <dt-bindings/reset/econet,en7580-scu.h>

    phy@1faf0000 {
        compatible = "airoha,en7580-xpon-phy";
        reg = <0x1faf0000 0x1000>, <0x1faf3000 0x1000>;
        reg-names = "pcs", "pma";
        resets = <&scuclk EN7580_XPON_PHY_RST>;
        reset-names = "phy";
        airoha,scu = <&scuclk>;
        tx-disable-gpios = <&pinctrl 38 GPIO_ACTIVE_HIGH>;
        #phy-cells = <0>;
    };
...
