%YAML 1.2
---
$id: http://devicetree.org/schemas/memory-controllers/airoha,dramc.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Airoha/Econet DRAM Controller

maintainers:
  - Benjamin Larsson <benjamin.larsson@genexis.eu>

description:
  The Airoha/Econet DRAM controller block provides registers for DRAM
  controller and DDR PHY telemetry, including the configured DRAM protocol,
  channel topology, rank configuration, installed capacity and current data
  rate. Some SoCs expose the DDR PHY registers through a separate register
  range, while others place the DDR PHY registers inside the DRAM controller
  register range.

properties:
  compatible:
    enum:
      - econet,en751221-dramc
      - econet,en7528-dramc
      - econet,en7580-dramc
      - airoha,en7523-dramc
      - airoha,an7552-dramc
      - airoha,an7581-dramc
      - airoha,an7583-dramc

  reg:
    minItems: 1
    maxItems: 2

  reg-names:
    minItems: 1
    maxItems: 2
    items:
      - const: dramc
      - const: ddrphy

  airoha,chip-scu:
    $ref: /schemas/types.yaml#/definitions/phandle
    description:
      Phandle to the chip system-controller syscon used to read the crystal
      clock selection. Required on SoCs whose DRAM data-rate calculation
      depends on the chip SCU register block.

required:
  - compatible
  - reg
  - reg-names

allOf:
  - if:
      properties:
        compatible:
          contains:
            const: airoha,en7523-dramc
    then:
      properties:
        reg:
          minItems: 2
        reg-names:
          minItems: 2
      required:
        - airoha,chip-scu
    else:
      properties:
        reg:
          maxItems: 1
        reg-names:
          maxItems: 1

  - if:
      properties:
        compatible:
          contains:
            enum:
              - airoha,en7523-dramc
              - airoha,an7581-dramc
    then:
      required:
        - airoha,chip-scu
    else:
      properties:
        airoha,chip-scu: false

additionalProperties: false

examples:
  - |
    dramc: memory-controller@1fb24000 {
        compatible = "airoha,en7523-dramc";
        reg = <0x1fb24000 0x1000>,
              <0x1fb28000 0x1000>;
        reg-names = "dramc", "ddrphy";
        airoha,chip-scu = <&chip_scu>;
    };
